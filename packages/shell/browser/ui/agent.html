<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Tools · 工具调试</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px system-ui,
          sans-serif;
        background: #111827;
        color: #e5e7eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 70% 0, #312e81, #111827 42%);
      }
      header {
        padding: 24px 30px 16px;
        border-bottom: 1px solid #374151;
      }
      h1 {
        margin: 0;
        font-size: 24px;
      }
      p {
        color: #a5b4fc;
      }
      main {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 18px;
        padding: 18px 30px;
        min-height: calc(100vh - 100px);
      }
      section,
      aside {
        background: #172033dd;
        border: 1px solid #374151;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 12px 35px #0003;
      }
      #tool-list {
        display: grid;
        gap: 8px;
        align-content: start;
      }
      .tool-button {
        text-align: left;
        padding: 11px;
        border: 1px solid #374151;
        border-radius: 8px;
        background: #1f2937;
        color: inherit;
        cursor: pointer;
      }
      .tool-button.selected {
        border-color: #818cf8;
        background: #312e81;
      }
      .tool-button small {
        display: block;
        color: #a5b4fc;
        margin-top: 3px;
        overflow-wrap: anywhere;
      }
      .workspace {
        display: grid;
        grid-template-rows: auto auto minmax(280px, 1fr);
        gap: 14px;
      }
      #tool-description {
        margin: 4px 0 0;
        color: #c4b5fd;
      }
      label {
        display: grid;
        gap: 5px;
        margin: 10px 0;
        color: #cbd5e1;
      }
      input,
      select,
      button {
        font: inherit;
      }
      input,
      select {
        padding: 8px;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: inherit;
        background: #111827;
      }
      button.action {
        padding: 9px 15px;
        border: 0;
        border-radius: 7px;
        color: white;
        background: #6366f1;
        cursor: pointer;
      }
      button.secondary {
        padding: 7px 11px;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: inherit;
        background: #1f2937;
        cursor: pointer;
      }
      #result-json {
        margin: 0;
        min-height: 280px;
        max-height: 60vh;
        overflow: auto;
        white-space: pre-wrap;
        padding: 14px;
        border-radius: 8px;
        background: #0b1020;
        color: #dbeafe;
      }
      #result-meta {
        color: #a5b4fc;
        margin: 0 0 8px;
        word-break: break-word;
      }
      #schema-json {
        max-height: 35vh;
        overflow: auto;
        white-space: pre-wrap;
      }
      details {
        margin-top: 14px;
      }
      summary {
        cursor: pointer;
        color: #c4b5fd;
      }
      #mcp-setup {
        margin: 0 30px 22px;
      }
      #mcp-setup[open] {
        max-width: 900px;
      }
      #mcp-setup label {
        display: inline-flex;
        margin-right: 14px;
      }
      #mcp-token {
        width: 290px;
      }
      #mcp-setup input,
      #mcp-setup select {
        padding: 6px;
      }
      #mcp-urls {
        padding-left: 18px;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
          padding: 14px;
        }
        header,
        #mcp-setup {
          margin-left: 0;
          margin-right: 0;
          padding-left: 14px;
          padding-right: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Agent Tools · 工具调试</h1>
      <p>读取 KC3 当前内存状态的只读工具。选择工具、填写参数并调用。</p>
      <div id="status" aria-live="polite">正在读取工具列表…</div>
    </header>
    <main>
      <aside aria-label="工具列表"><div id="tool-list"></div></aside>
      <section class="workspace" aria-label="工具调试区">
        <div>
          <h2 id="tool-title">选择工具</h2>
          <p id="tool-description">—</p>
        </div>
        <div>
          <form id="tool-form"></form>
          <button id="call-tool" class="action" type="submit" form="tool-form" disabled>
            调用工具
          </button>
        </div>
        <div>
          <p id="result-meta">暂无调用</p>
          <pre id="result-json">结果将在这里显示。</pre>
          <button id="copy-result" class="secondary" type="button">复制结果</button>
          <button id="download-result" class="secondary" type="button">下载 JSON</button>
          <details>
            <summary>查看工具 schema</summary>
            <pre id="schema-json"></pre>
          </details>
        </div>
      </section>
    </main>
    <details id="mcp-setup">
      <summary>LAN MCP 配置（可选）</summary>
      <p>通过标准 Streamable HTTP 将同一组只读工具提供给局域网 MCP 客户端。</p>
      <label><input id="mcp-enabled" type="checkbox" /> 启用</label
      ><label
        >Host<select id="mcp-host">
          <option value="127.0.0.1">127.0.0.1（本机）</option>
          <option value="0.0.0.0">0.0.0.0（局域网）</option>
        </select></label
      ><label
        >Port<input id="mcp-port" type="number" min="1" max="65535" step="1" value="39273"
      /></label>
      <div>
        <label
          >Bearer token <input id="mcp-token" type="password" readonly autocomplete="off" /></label
        ><button id="mcp-reveal" type="button" class="secondary">显示</button>
        <button id="mcp-copy" type="button" class="secondary">复制</button>
        <button id="mcp-rotate" type="button" class="secondary">轮换</button>
      </div>
      <div id="mcp-status">状态：未读取</div>
      <ul id="mcp-urls" hidden></ul>
      <button id="mcp-refresh" type="button" class="secondary">刷新状态</button>
      <button id="mcp-save" type="button" class="action">保存并应用</button>
    </details>
    <script src="./agent.js"></script>
  </body>
</html>
