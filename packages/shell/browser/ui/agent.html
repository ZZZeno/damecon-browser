<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damecon Agent API</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        margin: 24px;
        background: #202124;
        color: #e8eaed;
      }
      button {
        margin: 0 6px 8px 0;
        padding: 6px 10px;
      }
      pre {
        white-space: pre-wrap;
        overflow: auto;
        max-height: 75vh;
        padding: 12px;
        background: #17181a;
      }
      #status {
        color: #a8c7fa;
        margin: 8px 0 14px;
      }
      #mcp-setup {
        max-width: 760px;
        margin-top: 20px;
        padding: 14px;
        border: 1px solid #3c4043;
        border-radius: 6px;
      }
      #mcp-setup h2 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      #mcp-setup label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 0 12px 8px 0;
      }
      #mcp-setup input,
      #mcp-setup select {
        box-sizing: border-box;
        padding: 5px 7px;
        color: inherit;
        background: #303134;
        border: 1px solid #5f6368;
        border-radius: 3px;
      }
      #mcp-token {
        width: 290px;
      }
      #mcp-status {
        margin: 4px 0 8px;
        color: #bdc1c6;
      }
      #mcp-urls {
        margin: 4px 0 8px;
        padding-left: 18px;
      }
      .mcp-url {
        width: min(100%, 520px);
      }
    </style>
  </head>
  <body>
    <h1>Damecon Agent API</h1>
    <p>本页面只读 KC3 当前内存状态。浏览器自动化可在此页调用 <code>window.dameconAgent</code>。</p>
    <div>
      <button data-operation="health">Health</button>
      <button data-operation="snapshot">Snapshot</button>
      <button data-operation="fleets">Fleets</button>
      <button data-operation="landBases">Land bases</button>
      <button data-operation="equipment">Equipment</button>
      <button data-operation="improvements">Improvements</button>
      <button data-operation="quests">Quests</button>
      <button data-operation="schema">Schema</button>
      <button data-operation="tools">Tools</button>
    </div>
    <div id="status">Ready</div>
    <pre id="output">点击按钮读取当前数据。</pre>
    <section id="mcp-setup" aria-labelledby="mcp-heading">
      <h2 id="mcp-heading">LAN MCP（可选）</h2>
      <p>通过标准 Streamable HTTP 将同一组只读工具提供给局域网 MCP 客户端。</p>
      <label><input id="mcp-enabled" type="checkbox" /> 启用</label>
      <label
        >Host
        <select id="mcp-host">
          <option value="127.0.0.1">127.0.0.1（本机）</option>
          <option value="0.0.0.0">0.0.0.0（局域网）</option>
        </select>
      </label>
      <label
        >Port <input id="mcp-port" type="number" min="1" max="65535" step="1" value="39273"
      /></label>
      <div>
        <label
          >Bearer token <input id="mcp-token" type="password" readonly autocomplete="off"
        /></label>
        <button id="mcp-reveal" type="button">显示</button>
        <button id="mcp-copy" type="button">复制</button>
        <button id="mcp-rotate" type="button">轮换</button>
      </div>
      <div id="mcp-status">状态：未读取</div>
      <ul id="mcp-urls" hidden></ul>
      <button id="mcp-refresh" type="button">刷新状态</button>
      <button id="mcp-save" type="button">保存并应用</button>
    </section>
    <script src="./agent.js"></script>
  </body>
</html>
